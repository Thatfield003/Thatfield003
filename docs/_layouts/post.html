---
layout: default
---
<article class="post">
  <header class="container narrow page-header">
    <p class="meta"><time datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: '%B %-d, %Y' }}</time></p>
    <h1>{{ page.title }}</h1>
    {%- if page.description %}
    <p class="lede">{{ page.description }}</p>
    {%- endif %}
  </header>

  {%- if page.cover %}
  <figure class="container post-cover">
    <img src="{{ page.cover | escape }}" alt="{{ page.cover_alt | escape }}" width="1200" height="800">
    {%- if page.cover_credit %}
    <figcaption>{{ page.cover_credit }}</figcaption>
    {%- endif %}
  </figure>
  {%- endif %}

  <div class="container narrow prose">
    {{ content }}
  </div>

  <nav class="container narrow post-footer" aria-label="More posts">
    <a href="{{ '/posts/' | relative_url }}">&larr; All posts</a>
  </nav>
</article>
