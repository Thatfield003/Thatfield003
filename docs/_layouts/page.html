---
layout: default
---
<article class="container {{ page.width | default: 'narrow' }}">
  <header class="page-header">
    <h1>{{ page.title }}</h1>
    {%- if page.intro %}
    <p class="lede">{{ page.intro }}</p>
    {%- endif %}
  </header>
  <div class="prose">
    {{ content }}
  </div>
</article>
